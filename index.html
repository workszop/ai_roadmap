<!DOCTYPE html>
<html lang="pl" data-lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa AI dla małej firmy</title>
  <meta name="description" content="Bilingual, practical AI roadmap for a small business: choose one task, test it, introduce a simple routine, and maintain it." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23FFD500'/%3E%3Cg fill='none' stroke='%231C1917' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='6' cy='19' r='3'/%3E%3Cpath d='M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15'/%3E%3Ccircle cx='18' cy='5' r='3'/%3E%3C/g%3E%3C/svg%3E">

  <!-- ─── edustyl head: fonts + boot gate ─── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    @keyframes boot-reveal { to { visibility: visible; } }
    html:not(.app-ready) body { visibility: hidden; animation: boot-reveal 0s 4s forwards; }
    @media print { html:not(.app-ready) body { visibility: visible; animation: none; } }
  </style>
  <noscript><style>html:not(.app-ready) body { visibility: visible; animation: none; }</style></noscript>

  <style>
    /* ─── edulab tokens (edustyl tokens/colors_and_type.css) ─── */
    :root {
      --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
      --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

      --paper:    #FFFFFF;
      --paper-2:  #F5F3F0;
      --paper-3:  #EAE6E0;
      --surface:  #FFFFFF;

      --ink:      #1C1917;
      --ink-2:    #44403C;
      --ink-3:    #625B53;
      --line:     #E0DBD3;
      --line-2:   #C9C2B7;
      --line-strong: #857C69;

      --yellow:      #FFD500;
      --yellow-600:  #F0C800;
      --yellow-soft: #FFD500;
      --yellow-ink:  #1C1917;

      --blue:      #1E8FC2;
      --blue-600:  #177AA8;
      --blue-soft: #177AA8;
      --blue-ink:  #FFFFFF;

      --green:      #00A651;
      --green-600:  #078342;
      --green-soft: #078342;
      --green-ink:  #FFFFFF;

      --red:      #E5322D;
      --red-600:  #C92823;
      --red-soft: #C92823;
      --red-ink:  #FFFFFF;

      /* Grape - play palette, used as a phase category colour (white text 5.2:1) */
      --grape:     #7A5AC2;
      --grape-ink: #FFFFFF;

      --bg:        var(--paper);
      --fg:        var(--ink);
      --fg-muted:  var(--ink-2);
      --primary:   var(--yellow);
      --on-primary:#1C1917;
      --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
      --track: color-mix(in srgb, var(--ink) 24%, transparent);
      --on-dark-muted: color-mix(in srgb, var(--paper) 62%, transparent);
      --on-dark-line:  color-mix(in srgb, var(--paper) 14%, transparent);

      --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
      --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
      --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

      --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

      --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
      --shadow-md: 0 6px 18px rgba(33,30,26,.12), 0 1px 3px rgba(33,30,26,.08);
      --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
      --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);

      --display-font:  clamp(48px, 6vw, 72px);
      --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
      --body-lg: 18px; --body: 16px; --body-sm: 14px;
      --caption: 13px; --overline: 12px;

      /* page-level layout tokens */
      --wrap: 1100px;
      --gutter: 30px;
      --stat-value: 38px;
      --card-title: 20px;
    }

    :where(.edu) h1, .edu-h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--h1); line-height: 1.06; letter-spacing: -0.02em; color: var(--ink); }
    :where(.edu) h2, .edu-h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--h2); line-height: 1.12; letter-spacing: -0.015em; color: var(--ink); }
    :where(.edu) h3, .edu-h3 { font-family: var(--font-display); font-weight: 700; font-size: var(--h3); line-height: 1.2; letter-spacing: -0.01em; color: var(--ink); }
    :where(.edu) p, .edu-p { font-family: var(--font-sans); font-weight: 400; font-size: var(--body); line-height: 1.6; color: var(--ink-2); }
    .edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
    .edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
    .edu-overline { font-family: var(--font-mono); font-weight: 500; font-size: var(--overline); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }
    .edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p, .edu-block li, .edu-block small { color: inherit; }
    body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

    /* ─── Base ─── */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 96px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body { margin: 0; font-size: var(--body); line-height: 1.6; }
    a { color: var(--ink); text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
    a:hover { text-decoration-color: var(--ink); }
    :focus-visible { outline: 3px solid transparent; outline-offset: 2px; box-shadow: var(--focus-ring); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .skip { position: absolute; left: 16px; top: -60px; z-index: 100; background: var(--yellow); color: var(--yellow-ink); padding: 10px 16px; border-radius: var(--r-pill); font-weight: 600; }
    .skip:focus { top: 12px; }

    /* ─── Top menu ─── */
    .edu-header { position: sticky; top: 0; z-index: 50; width: 100%; background: var(--paper); border-bottom: 1px solid var(--line-2); }
    .edu-header-inner { max-width: var(--wrap); margin: 0 auto; padding: 8px var(--gutter); display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
    .edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
    .nav { display: flex; gap: 2px; list-style: none; margin: 0 0 0 18px; padding: 0; }
    .nav a { display: block; padding: 8px 12px; border-radius: var(--r-pill); color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 15px; transition: background-color .15s; }
    .nav a:hover { background: var(--paper-2); }
    .nav a.active { background: var(--yellow); color: var(--yellow-ink); font-weight: 600; }
    .head-tools { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .prog { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--ink); text-decoration: none; }
    .prog-track { width: 88px; height: 8px; background: var(--paper-3); border-radius: var(--r-pill); overflow: hidden; }
    .prog-fill { height: 100%; width: 0; background: var(--yellow); border-radius: var(--r-pill); transition: width .3s; }
    .edu-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); }
    .edu-seg button { border: none; background: transparent; padding: 6px 12px; border-radius: var(--r-pill); font-family: var(--font-sans); font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; }
    .edu-seg button[aria-pressed="true"] { background: var(--yellow); color: var(--yellow-ink); }

    /* ─── Page header ─── */
    .page-head { max-width: var(--wrap); margin: 0 auto; padding: 44px var(--gutter) 36px; text-align: left; border-bottom: 1px solid var(--line-2); }
    .page-head:has(+ main) { border-bottom: none; padding-bottom: 52px; }
    .app-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 5vw, 3.3rem); letter-spacing: -.025em; line-height: 1.05; color: var(--ink); margin: 0 0 14px; }
    .edu-lead { font-size: 1.15rem; line-height: 1.6; color: var(--ink-2); margin: 0; }
    .asof { margin: 14px 0 0; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }

    /* ─── Section bands ─── */
    main { margin: 0; padding: 0; }
    .sec { margin: 0; padding: 52px 0 60px; border-top: 1px solid var(--line); }
    .sec:nth-of-type(odd) { background: var(--paper-2); }
    .sec > .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gutter); }
    .sec-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
    .sec-head h2 { margin: 0; }
    .sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
    .sec-lead { margin: 0 0 26px; }

    /* ─── Chips ─── */
    .edu-chip { display: inline-block; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: var(--r-pill); background: var(--blue-soft); color: var(--blue-ink); white-space: nowrap; }
    .chip-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
    .chip-green  { background: var(--green-soft);  color: var(--green-ink); }
    .chip-red    { background: var(--red-soft);    color: var(--red-ink); }
    .chip-stone  { background: var(--paper-3);     color: var(--ink); }
    .count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; }

    /* ─── Stat blocks ─── */

    /* ─── Cards ─── */
    .card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; }
    .card-head { padding: 14px 22px; background: var(--paper-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card-head h3 { margin: 0; font-size: var(--card-title); }
    .card-body { padding: 18px 22px; flex: 1; }
    .card-body > :first-child { margin-top: 0; }
    .card-body > :last-child { margin-bottom: 0; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; align-items: start; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .mt { margin-top: 18px; }

    /* collapsible stream card */
    details.card > summary { list-style: none; cursor: pointer; }
    details.card > summary::-webkit-details-marker { display: none; }
    details.card:not([open]) > summary { border-bottom: none; }
    .chev { width: 18px; height: 18px; flex: none; color: var(--ink-2); transition: transform .2s; }
    details[open] .chev { transform: rotate(180deg); }
    details.card > summary:focus-visible { box-shadow: inset 0 0 0 3px var(--ink); }
    .head-right { display: flex; align-items: center; gap: 10px; }

    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 22px; }
    .controls .spacer { flex: 1; }
    .big-prog { display: flex; align-items: center; gap: 12px; font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
    .big-prog .prog-track { width: 180px; height: 10px; }

    /* ─── Buttons ─── */
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 9px 18px; font-family: var(--font-display); font-weight: 600; font-size: 15px; cursor: pointer; transition: background-color .15s; }
    .btn-ghost:hover { background: var(--paper-3); }
    .btn-ghost.armed { background: var(--red-soft); color: var(--red-ink); border-color: var(--red-soft); }

    /* ─── Checklist ─── */
    .checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .checklist li { display: flex; align-items: flex-start; gap: 6px; }
    .check { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; flex: 1; position: relative; color: var(--ink-2); line-height: 1.5; }
    .check input { position: absolute; opacity: 0; width: 22px; height: 22px; margin: 0; cursor: pointer; }
    .box { flex: none; width: 22px; height: 22px; margin-top: 1px; border: 1.5px solid var(--line-strong); border-radius: var(--r-xs); background: var(--surface); display: grid; place-items: center; transition: background-color .15s; }
    .box::after { content: ""; width: 6px; height: 11px; border: solid var(--yellow-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
    .check input:checked + .box { background: var(--yellow); border-color: var(--yellow-ink); }
    .check input:checked + .box::after { opacity: 1; }
    .check input:checked ~ .txt { color: var(--ink-3); }
    .check input:focus-visible + .box { box-shadow: var(--focus-ring); }
    .refs { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; padding-top: 2px; }
    .refs a { color: var(--ink-3); text-decoration: none; }
    .refs a:hover { text-decoration: underline; color: var(--ink); }

    /* ─── Gate & callouts ─── */
    .callout { margin-top: 18px; border-radius: var(--r-md); padding: 16px 20px; background: var(--yellow-soft); color: var(--yellow-ink); }
    .callout p { margin: 0; }
    .callout .refs, .callout .refs a { color: inherit; }

    /* dark data panel */
    .panel-dark { background: var(--ink); color: var(--paper); border-radius: var(--r-xl); padding: 28px 30px; }
    .panel-dark .edu-overline { color: var(--on-dark-muted); margin: 0 0 8px; }
    .panel-dark h3 { color: var(--paper); margin: 0 0 14px; font-size: 22px; }
    .panel-dark p { color: var(--paper); margin: 0 0 14px; }
    .pd-row { display: flex; gap: 14px; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--on-dark-line); font-size: 15px; }
    .pd-row b { font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--yellow); width: 18px; flex: none; }
    .panel-dark .pd-foot { margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--on-dark-line); color: var(--on-dark-muted); font-size: var(--body-sm); }
    .panel-dark .refs, .panel-dark .refs a { color: var(--on-dark-muted); }
    .plain { margin: 0; padding-left: 20px; color: var(--ink-2); }
    .plain li { margin: 6px 0; line-height: 1.5; }

    /* ─── Sources ─── */
    .sources { margin: 0; padding-left: 28px; columns: 2; column-gap: 36px; font-size: var(--body-sm); color: var(--ink-2); }
    .sources li { break-inside: avoid; margin: 0 0 10px; line-height: 1.45; scroll-margin-top: 110px; }
    .sources li:target { background: var(--yellow); color: var(--yellow-ink); border-radius: var(--r-xs); }
    .sources .src-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
    .sources li:target .src-meta { color: var(--yellow-ink); }

    /* ─── Tones: category colours, always paired with a text label ─── */
    .tone-grape  { background: var(--grape);      color: var(--grape-ink); }
    .tone-blue   { background: var(--blue-soft);  color: var(--blue-ink); }
    .tone-yellow { background: var(--yellow);     color: var(--yellow-ink); }
    .tone-green  { background: var(--green-soft); color: var(--green-ink); }
    .tone-red    { background: var(--red-soft);   color: var(--red-ink); }
    .tone-ink    { background: var(--ink);        color: var(--paper); }
    .tone-stone  { background: var(--paper-3);    color: var(--ink); }
    .ic { width: 18px; height: 18px; flex: none; }
    .badge { flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); display: inline-grid; place-items: center; }
    .badge-lg { width: 46px; height: 46px; border-radius: var(--r-md); }
    .badge-lg .ic { width: 24px; height: 24px; }
    .badge.tone-ink { color: var(--yellow); }
    .tile-h { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .tile-h h3 { margin: 0; font-size: 18px; line-height: 1.3; }
    .card-foot { padding: 12px 22px; border-top: 1px dashed var(--line-2); font-size: var(--body-sm); color: var(--ink-2); font-weight: 600; }

    /* ─── Phase timeline (single-series: position = time, label = identity) ─── */
    .gantt .card-body { padding: 10px 22px 16px; }
    .g-axis, .g-row { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: center; }
    .g-scale { position: relative; height: 22px; }
    .g-tick { position: absolute; top: 2px; transform: translateX(-50%); font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
    .g-tick:first-child { transform: none; }
    .g-row { padding: 10px 10px; margin: 0 -10px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; transition: background-color .15s; }
    .g-row:hover { background: var(--paper-2); }
    .g-label { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .g-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .g-name { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.2; color: var(--ink); }
    .g-time { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
    .g-track { position: relative; height: 26px; background: var(--paper-3); border-radius: var(--r-pill); }
    .g-bar { position: absolute; top: 0; bottom: 0; background: var(--ink); border-radius: var(--r-pill); overflow: hidden; display: flex; align-items: center; justify-content: flex-end; }
    .g-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--yellow); transition: width .3s; }
    .g-bar .ic { position: relative; color: var(--yellow); width: 16px; height: 16px; margin-right: 8px; }

    /* ─── Phase intro block ─── */
    .phase-hero { border-radius: var(--r-xl); padding: 26px 30px; display: grid; grid-template-columns: 1fr 230px; gap: 32px; align-items: center; margin-bottom: 20px; }
    .phase-hero .edu-overline { color: inherit; margin: 0 0 8px; }
    .ph-intro { margin: 0; font-size: var(--body-lg); line-height: 1.55; }
    .ph-side { display: flex; flex-direction: column; gap: 10px; }
    .ph-num { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; }
    .ph-lbl { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-left: 10px; }
    .ph-bar { height: 10px; border-radius: var(--r-pill); background: color-mix(in srgb, currentColor 24%, transparent); overflow: hidden; }
    .ph-bar span { display: block; height: 100%; width: 0; background: currentColor; border-radius: var(--r-pill); transition: width .3s; }
    .ph-meta { font-size: var(--body-sm); }
    .phase-hero.tone-ink .edu-overline, .phase-hero.tone-ink .ph-num { color: var(--yellow); }

    /* ─── Gate card ─── */
    .gate-card { margin-top: 18px; }
    .gate-card .card-head { flex-wrap: wrap; }
    .outcomes { display: flex; gap: 6px; flex-wrap: wrap; }
    .gate-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 28px; }
    .gate-list li { display: flex; gap: 10px; align-items: flex-start; color: var(--ink-2); line-height: 1.5; }
    .gate-list .ic { color: var(--green-600); margin-top: 3px; }

    /* ─── Regulatory timeline ─── */
    .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink); }
    .legend > span { display: inline-flex; align-items: center; gap: 8px; }
    .tl { list-style: none; margin: 0; padding: 0; }
    .tl-row, .tl-year { display: grid; grid-template-columns: 170px 28px 1fr; column-gap: 16px; }
    .tl-rail { position: relative; display: flex; justify-content: center; }
    .tl-rail::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-50%); background: var(--line-2); }
    .tl > li:first-child .tl-rail::before { top: 14px; }
    .tl > li:last-child .tl-rail::before { bottom: auto; height: 14px; }
    .tl-dot { position: relative; z-index: 1; flex: none; display: inline-block; width: 16px; height: 16px; border-radius: 50%; }
    .tl-rail .tl-dot { margin-top: 6px; }
    .dot-inforce { background: var(--green-soft); }
    .dot-soon { background: var(--red-soft); }
    .dot-later { background: var(--surface); border: 2px solid var(--line-strong); }
    .dot-today { width: 22px; height: 22px; background: var(--yellow); border: 3px solid var(--ink); }
    .tl-rail .dot-today { margin-top: 3px; }
    .tl-date { padding: 4px 0 20px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
    .tl-body { padding: 2px 0 20px; }
    .tl-body p { margin: 6px 0 0; }
    .tl-today .tl-body { padding-bottom: 22px; }
    .tl-ylabel { padding: 4px 0 12px; font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--ink); }

    /* ─── Autonomy ladder ─── */
    .ladder-axis { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-family: var(--font-mono); font-size: 12px; color: var(--ink); text-transform: uppercase; letter-spacing: .06em; }
    .ladder-axis .axis-line { flex: 1; height: 2px; background: var(--line-2); }
    .ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .rung-head { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
    .rung-head h3 { margin: 0; font-size: 21px; }
    .rung-top { display: flex; align-items: center; justify-content: space-between; }
    .rung-top .ic { width: 22px; height: 22px; }
    .pips { display: flex; gap: 4px; }
    .pip { width: 16px; height: 6px; border-radius: var(--r-pill); background: color-mix(in srgb, currentColor 28%, transparent); }
    .pip.on { background: currentColor; }
    .rung .card-body p { margin: 0 0 14px; font-size: var(--body-sm); line-height: 1.5; }
    .rung .card-body .edu-overline { margin: 0 0 4px; font-size: 11px; }

    /* ─── Tiles & pitfalls ─── */
    .tile .card-body p { margin: 0; }
    .pit .card-head { justify-content: flex-start; }
    .pit .tile-h h3 { font-size: 17px; }
    .pit-fix { display: flex; gap: 12px; align-items: flex-start; }
    .pit-fix p { margin: 6px 0 0; color: var(--ink-2); }

    /* ─── Footer ─── */
    .foot { border-top: 1px solid var(--line-2); }
    .foot-inner { max-width: var(--wrap); margin: 0 auto; padding: 26px var(--gutter) 40px; display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; font-size: var(--body-sm); color: var(--ink-3); }
    .foot kbd { font-family: var(--font-mono); font-size: 12px; background: var(--paper-3); color: var(--ink); border-radius: var(--r-xs); padding: 1px 6px; }

    /* ─── Responsive ─── */
    @media (max-width: 1080px) {
      .ladder { grid-template-columns: repeat(2, 1fr); }
      .g-axis, .g-row { grid-template-columns: 250px 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .nav a { padding: 8px 9px; }
    }
    @media (max-width: 900px) { .nav { display: none; } }
    @media (max-width: 768px) {
      :root { --gutter: 16px; }
      .edu-logo { width: 48px; height: 48px; }
      .edu-header-inner { padding: 6px var(--gutter); }
      .head-tools .prog-track { display: none; }
      .page-head { padding: 28px var(--gutter) 32px; }
      .sec { padding: 36px 0 44px; }
      .sec-head { flex-direction: column; align-items: stretch; gap: 12px; }
      .sec-head::after { flex: none; width: 100%; }
      :where(.edu) h2 { font-size: 28px; }
      .sec-head { flex-direction: row; flex-wrap: wrap; align-items: center; }
      .sec-head h2 { flex: 1; min-width: 0; }
      .sec-head::after { flex: 1 0 100%; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .sources { columns: 1; }
      .big-prog .prog-track { width: 120px; }
      .g-axis { display: none; }
      .g-row { grid-template-columns: 1fr; gap: 10px; }
      .phase-hero { grid-template-columns: 1fr; padding: 22px; gap: 18px; }
      .gate-list { grid-template-columns: 1fr; }
      .tl-row, .tl-year { grid-template-columns: 24px 1fr; column-gap: 12px; }
      .tl-row .tl-rail, .tl-year .tl-rail { grid-column: 1; grid-row: 1 / span 2; }
      .tl-row .tl-date { grid-column: 2; grid-row: 1; padding-bottom: 2px; }
      .tl-row .tl-body { grid-column: 2; grid-row: 2; }
      .tl-year .tl-ylabel { grid-column: 2; grid-row: 1; }
    }
    @media (max-width: 480px) {
      .stats, .ladder { grid-template-columns: 1fr; }
      .edu-wordmark { font-size: 19px; }
      .head-tools { gap: 8px; }
    }
    @media print {
      .edu-header, .controls, .skip { display: none; }
    }
  </style>
</head>

  function updateProgress() {
    const all = allActions();
    const n = countDone(all);
    const p = pct(n, all.length);
    document.body.dataset.done = n;
    document.body.dataset.total = all.length;
    headProgFill.style.width = p + '%';
    headProgText.textContent = `${n}/${all.length}`;

    const big = document.getElementById('bigProgFill');

      document.getElementById('bigProgText').textContent = `${n}/${all.length} ${t('done')} · ${p}%`;

    PHASES.forEach(ph => {
      const list = phaseActions(ph);
      const d = countDone(list);
      document.querySelectorAll(`[data-count="${ph.id}"]`).forEach(el => { el.textContent = `${d}/${list.length}`; });

  // ─── Verification probe ───
  // Invariants on data + DOM. Run window.ROADMAP_CHECK() from DevTools or a headless probe.
  function ROADMAP_CHECK() {
    const errors = [];
    const data = { CLOCK, PHASES, AUTONOMY, RULE_OF_TWO, TOOL_RULES, SAFETY, KPIS, KPI_NOTE, INDUSTRIES, PITFALLS, SOURCES };
    const walk = (node, path) => {
      if (Array.isArray(node)) return node.forEach((n, i) => walk(n, `${path}[${i}]`));
      if (node && typeof node === 'object') {
        if ('pl' in node || 'en' in node) {
          LANGS.forEach(l => {
            const v = node[l];
            const vals = Array.isArray(v) ? v : [v];
            if (!v || vals.some(x => typeof x !== 'string' || !x.trim())) errors.push(`missing ${l} at ${path}`);
          });
          if (Array.isArray(node.pl) && Array.isArray(node.en) && node.pl.length !== node.en.length) errors.push(`pl/en length mismatch at ${path}`);
        }
        Object.entries(node).forEach(([k, v]) => walk(v, `${path}.${k}`));
      } else if (typeof node === 'string' && node.includes('\u2014')) {
        errors.push(`em-dash at ${path}`);
      }
    };
    walk(data, '$');
    LANGS.forEach(l => Object.entries(T[l]).forEach(([k, v]) => { if (typeof v === 'string' && v.includes('\u2014')) errors.push(`em-dash in T.${l}.${k}`); }));
    const tKeys = LANGS.map(l => Object.keys(T[l]).sort().join());
    if (tKeys[0] !== tKeys[1]) errors.push('T.pl and T.en keys differ');
    const ids = allActions().map(a => a.id);
    if (PHASES.length !== 4) errors.push(`phase count ${PHASES.length} != 4`);
    if (PHASES.some(p => phaseActions(p).length !== 5)) errors.push('each phase must have exactly 5 actions');
    if (new Set(ids).size !== ids.length) errors.push('duplicate action ids');
    if (ids.some(id => !/^sme\.[a-z]+\.action\.\d{3}$/.test(id))) errors.push('unstable or unnamespaced action id');
    const srcIds = new Set(SOURCES.map(s => s.id));
    const usedSrc = new Set();
    const collectSrc = node => {
      if (Array.isArray(node)) return node.forEach(collectSrc);
      if (node && typeof node === 'object') {
        if (Array.isArray(node.src)) node.src.forEach(id => { usedSrc.add(id); if (!srcIds.has(id)) errors.push(`unknown source ${id}`); });
        Object.values(node).forEach(collectSrc);
      }
    };
    collectSrc(data);
    SOURCES.forEach(s => {
      if (!usedSrc.has(s.id)) errors.push(`unused source ${s.id}`);
      if (!/^https:\/\//.test(s.url)) errors.push(`non-https source ${s.id}`);
    });
    const TONES = ['grape', 'blue', 'yellow', 'green', 'red', 'ink', 'stone'];
    PHASES.forEach(p => {
      if (!TONES.includes(p.tone) || !p.icon || !Array.isArray(p.span)) errors.push(`phase ${p.id} missing tone/icon/span`);
      p.streams.forEach(s => { if (!s.icon) errors.push(`stream ${s.id} missing icon`); });
    });
    [...AUTONOMY, ...SAFETY, ...KPIS, ...INDUSTRIES].forEach((x, i) => { if (!TONES.includes(x.tone) || !x.icon) errors.push(`tile ${i} missing tone/icon`); });
    if (document.querySelectorAll('[data-today]').length !== 1) errors.push('today marker missing or duplicated');
    if (window.lucide && document.querySelector('main i[data-lucide]')) errors.push('icons not drawn');
    const boxes = document.querySelectorAll('input[data-action]').length;
    if (boxes !== ids.length) errors.push(`checkbox count ${boxes} != actions ${ids.length}`);
    if (String(ids.length) !== document.body.dataset.total) errors.push('body[data-total] out of sync');
    if (String(countDone(allActions())) !== document.body.dataset.done) errors.push('body[data-done] out of sync');
    if (document.querySelectorAll('.sources li').length !== SOURCES.length) errors.push('source list out of sync');
    if (document.querySelectorAll('section.phase').length !== PHASES.length) errors.push('phase sections out of sync');
    if (html.lang !== state.lang || html.dataset.lang !== state.lang) errors.push('html[lang] out of sync');
    if (STORAGE_KEYS.done === STORAGE_KEYS.legacyDone) errors.push('new storage key aliases legacy key');
    if (state.legacyRaw !== null && !document.querySelector('[data-legacy-notice]')) errors.push('legacy notice missing');
    return { ok: errors.length === 0, errors, actions: ids.length, done: state.done.size, sources: SOURCES.length, lang: state.lang, storageKey: STORAGE_KEYS.done, legacyKey: STORAGE_KEYS.legacyDone };
  }
  window.ROADMAP_CHECK = ROADMAP_CHECK;

  // ─── Listeners ───
  langSeg.addEventListener('click', e => {
    const b = e.target.closest('[data-lang-btn]');
    if (b) setLang(b.dataset.langBtn);
  });

  pageHead.addEventListener('click', e => {
    if (e.target.closest('[data-legacy-download]')) downloadLegacyBackup();
  });

  mainEl.addEventListener('change', e => {
    const box = e.target.closest('input[data-action]');
    if (!box) return;
    if (box.checked) state.done.add(box.dataset.action); else state.done.delete(box.dataset.action);
    saveDone();
    updateProgress();
    announce(t('aProgress', state.done.size, allActions().length));
  });

  mainEl.addEventListener('toggle', e => {
    const d = e.target;
    if (!d.matches || !d.matches('details.stream')) return;
    if (d.open) state.collapsed.delete(d.dataset.stream); else state.collapsed.add(d.dataset.stream);
    updateToggleLabel();
  }, true);

  mainEl.addEventListener('click', e => {
    if (e.target.closest('#toggleAll')) toggleAll();
    const r = e.target.closest('#resetBtn');
    if (r) handleReset(r);
  });

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tgt = e.target;
    if (tgt.isContentEditable || tgt.matches('textarea, select, input:not([type="checkbox"])')) return;
    const k = e.key.toLowerCase();
    if (k === 'l') setLang(state.lang === 'pl' ? 'en' : 'pl');
    else if (k === 'e') toggleAll();
    else if (/^[1-4]$/.test(k)) jumpToPhase(k);
  });

  // ─── Init ───
  (function init() {
    const savedLang = store.get(STORAGE_KEYS.lang);
    if (LANGS.includes(savedLang)) state.lang = savedLang;
    state.legacyRaw = store.get(STORAGE_KEYS.legacyDone);
    try {
      const saved = JSON.parse(store.get(STORAGE_KEYS.done) || '[]');
      const valid = new Set(allActions().map(a => a.id));
      if (Array.isArray(saved)) saved.filter(id => valid.has(id)).forEach(id => state.done.add(id));
    } catch { /* corrupt storage: start empty */ }
    renderChrome();
    renderMain();
    const check = ROADMAP_CHECK();
    if (!check.ok) console.warn('[roadmap] invariant errors', check.errors);

    // ─── Reveal ───
    Promise.race([
      Promise.all(BRAND_FONTS.map(f => document.fonts.load(f).catch(() => null))),
      new Promise(r => setTimeout(r, FONT_WAIT_MS)),
    ]).then(() => {
      html.classList.add('app-ready');
      if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
    });
  })();
  </script>
</body>
</html>
